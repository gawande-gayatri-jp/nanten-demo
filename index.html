<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nanten - Computational platform for the Japanese power market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#FFFFFF;--bg-2:#F4F6F8;--bg-3:#E9EDF1;--line:#D9DFE6;--line-2:#E8ECF0;
  --ink:#121A24;--ink-2:#45515E;--ink-3:#73808D;--ink-4:#A3ACB6;
  --navy:#0E2240;--navy-2:#14305A;--ink-acc:#0E2240;--navy-ink:#F3F6FA;--navy-mute:#A9B8CC;
  --amber:#E89B2C;--amber-2:#F6B85A;--teal:#1F8A8A;--teal-2:#3AA8A8;--sky:#4C8ED6;
  --pos:#1E7A4F;--pos-bg:#E6F3EC;--neg:#B13A2A;--neg-bg:#FBEAE6;--warn:#8C5A0F;--warn-bg:#FBF0DC;--info:#2A5B8F;--info-bg:#E9F0F8;
  --sel:#EEF3FA;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;--serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12171D;--bg-2:#171D24;--bg-3:#1F262E;--line:#2B343E;--line-2:#242C35;--ink:#E7EBEF;--ink-2:#B3BCC6;--ink-3:#808B97;--ink-4:#5B6672;--sel:#1B2733;--ink-acc:#8FB4E3;--pos:#5DBD8C;--pos-bg:#16301F;--neg:#E57F6D;--neg-bg:#3A1F19;--warn:#DBA24C;--warn-bg:#3A2D14;--info:#7FB3EA;--info-bg:#17293C}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12171D;--bg-2:#171D24;--bg-3:#1F262E;--line:#2B343E;--line-2:#242C35;--ink:#E7EBEF;--ink-2:#B3BCC6;--ink-3:#808B97;--ink-4:#5B6672;--sel:#1B2733;--ink-acc:#8FB4E3;--pos:#5DBD8C;--pos-bg:#16301F;--neg:#E57F6D;--neg-bg:#3A1F19;--warn:#DBA24C;--warn-bg:#3A2D14;--info:#7FB3EA;--info-bg:#17293C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--info);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.005em}p{margin:0}
code,.mono{font-family:var(--mono);font-size:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--navy)}
.hide{display:none!important}

/* ===== landing ===== */
.land{background:var(--bg)}
.lnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--navy);color:var(--navy-ink);height:56px;display:flex;align-items:center;gap:22px;padding:0 40px;overflow:hidden}
.lnav .wm{font-family:'Manrope',var(--serif);font-size:22px;font-weight:700;letter-spacing:-.02em;color:#fff;display:inline-flex;align-items:center;gap:9px}
.lnav .wm .mark{width:28px;height:28px;display:block}
.lnav a{color:var(--navy-mute);font-weight:500;white-space:nowrap}.lnav .lk2{font-size:12.5px;font-weight:400}@media (max-width:1500px){.lnav .lk2{display:none}}.lnav a:hover{color:#fff;text-decoration:none}
.lnav .sp{flex:1}
.lnav .cta{background:var(--amber);color:#1A1200;padding:7px 14px;border-radius:3px;font-weight:600}
.lnav .cta:hover{background:var(--amber-2)}
.hero{background:var(--navy);color:var(--navy-ink);padding:64px 40px 72px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:center}
.hero h1{font-family:var(--serif);font-size:48px;line-height:1.08;font-weight:600;color:#fff;max-width:14ch}
.hero .lede{font-size:17px;line-height:1.55;color:var(--navy-mute);max-width:52ch;margin:22px 0 28px}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap}
.hero .acts a{padding:11px 18px;border-radius:3px;font-weight:600}
.hero .acts .p{background:var(--amber);color:#1A1200}.hero .acts .p:hover{background:var(--amber-2);text-decoration:none}
.hero .acts .s{border:1px solid #3B5680;color:#fff}.hero .acts .s:hover{background:var(--navy-2);text-decoration:none}
.hero .ticker{display:flex;gap:28px;margin-top:36px;flex-wrap:wrap}
.hero .ticker div{font-size:12.5px;color:var(--navy-mute)}.hero .ticker b{display:block;color:#fff;font-size:18px;font-weight:600}
.still{background:#0A1A33;border:1px solid #27416A;border-radius:4px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.still svg{display:block;width:100%;height:auto}
.still .cap{display:flex;justify-content:space-between;padding:7px 12px;border-top:1px solid #27416A;color:var(--navy-mute);font-size:11.5px;font-family:var(--mono)}
.sec{padding:64px 40px}
.sec.alt{background:var(--bg-2)}
.sec .kick{color:var(--amber);font-weight:600;font-size:13px;margin-bottom:8px}
.sec h2{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1.15;max-width:26ch}
.sec .sub{color:var(--ink-2);font-size:16px;max-width:60ch;margin-top:12px;line-height:1.55}
.prods{display:grid;grid-template-columns:1fr;gap:0;margin-top:36px;border-top:1px solid var(--line)}
.prod{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:40px;padding:36px 0;border-bottom:1px solid var(--line);align-items:center}
.prod:nth-child(even){grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.prod:nth-child(even) .still{order:-1}
.prod h3{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.2}
.prod .num{font-family:var(--mono);color:var(--ink-3);font-size:12px;margin-bottom:10px}
.prod p{color:var(--ink-2);font-size:15px;line-height:1.6;margin-top:12px;max-width:56ch}
.prod ul{margin:14px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.prod li{font-size:13.5px;color:var(--ink-2);padding-left:14px;position:relative}
.prod li::before{content:"";position:absolute;left:0;top:9px;width:6px;height:1px;background:var(--amber)}
.prod .open{display:inline-block;margin-top:18px;font-weight:600;color:var(--ink);border-bottom:2px solid var(--amber);padding-bottom:2px}
.prod .open:hover{text-decoration:none;color:var(--amber)}
.clients{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:32px}
.client .still.scene{margin:-22px -20px 14px;border-radius:3px 3px 0 0;box-shadow:none}
.client .req{margin:10px 0 0;padding:0;list-style:none}.client .req li{font-size:12.5px;color:var(--ink-2);padding:3px 0 3px 12px;position:relative;border-top:1px solid var(--line-2)}.client .req li::before{content:"";position:absolute;left:0;top:11px;width:5px;height:1px;background:var(--amber)}
.client .open{display:inline-block;margin-top:12px;font-weight:600;color:var(--ink);border-bottom:2px solid var(--amber);padding-bottom:1px;font-size:13px}
.lnav .lang,.top .lang{background:transparent;border:1px solid #3B5680;color:#fff;border-radius:3px;padding:5px 10px;cursor:pointer;font-size:12.5px}
.client{background:var(--bg);padding:22px 20px;cursor:pointer;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.client:hover{background:var(--sel)}
.client h3{font-size:15px;font-weight:600}
.client .who{font-size:12.5px;color:var(--ink-3);margin:4px 0 12px}
.client p{font-size:13px;color:var(--ink-2);line-height:1.5}
.client .st{margin-top:12px;font-size:12.5px;color:var(--ink-2)}
.client .st b{display:block;color:var(--ink);font-size:13px}
.plat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;margin-top:32px}
.plat h3{font-size:15px}.plat p{font-size:13.5px;color:var(--ink-2);margin-top:8px;line-height:1.55}
.plat .n{font-family:var(--serif);font-size:30px;color:var(--ink-acc);font-weight:600}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-top:32px;border:1px solid var(--line)}
.flow div{padding:18px;border-right:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.flow div:last-child{border-right:0}.flow b{display:block;color:var(--ink);font-size:14px;margin-bottom:6px}
.flow .mono{color:var(--ink-3)}
.cta-band{background:var(--navy);color:#fff;padding:52px 40px;display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.cta-band h2{font-family:var(--serif);font-size:28px;font-weight:600;flex:1;min-width:280px}
.cta-band a{background:var(--amber);color:#1A1200;padding:11px 18px;border-radius:3px;font-weight:600}
.cta-band a.s{background:transparent;border:1px solid #3B5680;color:#fff}
html[lang=ja] .hero h1{max-width:20ch;font-size:42px}html[lang=ja] .sec h2{max-width:30ch}
@media (max-width:1000px){.clients{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr;padding:40px 22px}.hero h1{font-size:36px}.sec{padding:44px 22px}.lnav{padding:0 18px;gap:16px}.lnav a.lk{display:none}.prod,.prod:nth-child(even){grid-template-columns:1fr}.prod:nth-child(even) .still{order:0}.flow{grid-template-columns:1fr}.flow div{border-right:0;border-bottom:1px solid var(--line)}.cta-band{padding:36px 22px}}
@media (max-width:600px){.clients{grid-template-columns:1fr}.prod ul{grid-template-columns:1fr}}

/* ===== app ===== */
.app{display:none;min-height:100%}
.app.on{display:block}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;height:48px;background:var(--navy);color:var(--navy-ink);display:flex;align-items:center;gap:16px;padding:0 16px}
.top .wm{font-family:'Manrope',var(--serif);font-size:19px;font-weight:700;letter-spacing:-.02em;color:#fff}.top .wm .mark{display:block}
.top .ws{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--navy-mute)}
.top select{background:var(--navy-2);border:1px solid #2E4A75;color:#fff;border-radius:3px;padding:4px 8px;font-size:12.5px}
.top .search{flex:1;max-width:420px}.top .search input{width:100%;background:var(--navy-2);border:1px solid #2E4A75;border-radius:3px;color:#fff;padding:5px 10px;outline:none}
.top .search input::placeholder{color:var(--navy-mute)}
.top .sp{flex:1}.top .meta{font-size:12px;color:var(--navy-mute)}
.top .lk{color:var(--navy-mute);font-size:12.5px}.top .lk:hover{color:#fff;text-decoration:none}
.top .user{width:26px;height:26px;border-radius:50%;background:var(--amber);color:#1A1200;display:grid;place-items:center;font-size:11px;font-weight:600}
.frame{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 48px)}
.nav{background:var(--bg-2);border-right:1px solid var(--line);position:sticky;top:calc(48px + env(safe-area-inset-top,0px));height:calc(100vh - 48px);height:calc(100dvh - 48px);overflow:auto;padding:8px 0 24px}
.nav .grp{margin-top:6px}
.nav .gh{display:flex;align-items:center;gap:8px;padding:8px 16px;cursor:pointer;color:var(--ink);font-weight:600;font-size:13px;user-select:none}
.nav .gh .ar{margin-left:auto;color:var(--ink-4);font-size:11px;transition:transform .15s}
.nav .grp.open .gh .ar{transform:rotate(90deg)}

.nav .gi{display:none}.nav .grp.open .gi{display:block}
.nav .gi a{display:block;padding:5px 16px 5px 42px;color:var(--ink-2);font-size:13px;border-left:2px solid transparent}
.nav .gi a:hover{color:var(--ink);background:var(--bg-3);text-decoration:none}
.nav .gi a.on{color:var(--ink);background:var(--bg);border-left-color:var(--amber);font-weight:500}
.nav .gh.on{color:var(--ink-acc)}
.main{min-width:0;display:grid;grid-template-columns:1fr 0}
.main.drawer-open{grid-template-columns:1fr 400px}
.page{min-width:0;padding:18px 26px 60px;overflow-x:clip}
.drawer{border-left:1px solid var(--line);background:var(--bg);overflow:auto;position:sticky;top:calc(48px + env(safe-area-inset-top,0px));height:calc(100vh - 48px);display:none}
.main.drawer-open .drawer{display:block}
.drawer .dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.drawer .dh h2{font-size:14px}.drawer .dh p{color:var(--ink-3);font-size:12px;margin-top:2px}.drawer .dh button{margin-left:auto}
.drawer .db{padding:6px 18px 24px}
.drawer h3{font-size:12px;color:var(--ink-3);font-weight:500;margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line-2)}
.crumb{font-size:12.5px;color:var(--ink-3);margin-bottom:6px}.crumb a{color:var(--ink-3)}
.ph{display:flex;align-items:flex-end;gap:16px;margin-bottom:14px}
.ph h1{font-family:var(--serif);font-size:24px;font-weight:600}
.ph p{color:var(--ink-3);margin-top:3px;font-size:13px;max-width:70ch}
.ph .acts{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:7px 10px;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--amber);font-weight:500}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:12.5px;color:var(--ink-2)}.toolbar .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:3px;padding:6px 11px;cursor:pointer;font-weight:500;color:var(--ink)}
.btn:hover{background:var(--bg-2)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}.btn.pri:hover{background:var(--navy-2)}
.btn.amb{background:var(--amber);border-color:var(--amber);color:#1A1200}.btn.amb:hover{background:var(--amber-2)}
.btn.sm{padding:2px 7px;font-size:12px;font-weight:400}.btn:disabled{opacity:.5;cursor:default}
select.sel,input.inp,textarea.inp{border:1px solid var(--line);border-radius:3px;background:var(--bg);padding:5px 8px;outline:none}
select.sel:focus,input.inp:focus,textarea.inp:focus{border-color:var(--sky)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{position:sticky;top:0;background:var(--bg);text-align:left;font-weight:500;color:var(--ink-3);padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:top;white-space:nowrap}
.tbl td.wrap{white-space:normal;min-width:220px}.tbl .num{text-align:right}
.tbl tr.row{cursor:pointer}.tbl tr.row:hover td{background:var(--bg-2)}.tbl tr.sel td{background:var(--sel)}
.tbl .sub{display:block;color:var(--ink-3);font-size:11.5px;margin-top:1px}.tbl .neg{color:var(--neg)}.tbl .pos{color:var(--pos)}
.tfoot{display:flex;justify-content:space-between;color:var(--ink-3);font-size:12px;padding:8px 2px}
.wrapx{overflow-x:auto;border:1px solid var(--line);border-radius:3px}
.wrapx .tbl th:first-child,.wrapx .tbl td:first-child{padding-left:12px}
.st{display:inline-block;font-size:11.5px;padding:1px 6px;border-radius:2px;line-height:1.5;font-weight:500;border:1px solid transparent}
.st.g{color:var(--pos);background:var(--pos-bg)}.st.r{color:var(--neg);background:var(--neg-bg)}.st.y{color:var(--warn);background:var(--warn-bg)}.st.b{color:var(--info);background:var(--info-bg)}.st.n{color:var(--ink-2);background:var(--bg-3)}.st.o{background:none;border-color:var(--line);color:var(--ink-2)}
.cols{display:grid;gap:18px}.cols>*{min-width:0}
.c2{grid-template-columns:1fr 1fr}.c21{grid-template-columns:2fr 1fr}.c12{grid-template-columns:1fr 2fr}.c3{grid-template-columns:1fr 1fr 1fr}.c13{grid-template-columns:340px 1fr}
.panel{border:1px solid var(--line);border-radius:3px;background:var(--bg);min-width:0}
.panel .pt{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel .pt h2{font-size:13px}.panel .pt span{color:var(--ink-3);font-size:12px}.panel .pt .r{margin-left:auto}
.panel .pb{padding:10px 12px}.panel .pb.np{padding:0;overflow-x:auto}
.panel.inputs{background:var(--bg-2)}
.kv{display:grid;grid-template-columns:minmax(120px,42%) 1fr;gap:4px 12px;font-size:12.5px}.kv dt{color:var(--ink-3)}.kv dd{margin:0;text-align:right}.kv dd.l{text-align:left}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:3px;margin-bottom:14px}
.stat{padding:10px 12px;border-right:1px solid var(--line-2)}.stat:last-child{border-right:0}
.stat .l{color:var(--ink-3);font-size:12px}.stat .v{font-size:19px;font-weight:600;margin-top:2px;letter-spacing:-.01em}.stat .v small{font-size:12px;font-weight:400;color:var(--ink-3);margin-left:3px}.stat .d{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.chart{position:relative;width:100%}.chart canvas{width:100%!important}
.form{display:grid;grid-template-columns:180px 1fr;gap:8px 12px;align-items:center;font-size:12.5px}
.form label{color:var(--ink-2)}.form .inp,.form .sel{width:100%}.form .hint{grid-column:2;color:var(--ink-3);font-size:11.5px;margin-top:-4px}
.form .full{grid-column:1/3}
.form input[type=range]{width:100%;accent-color:var(--ink-acc)}
.rng{display:flex;align-items:center;gap:8px}.rng output{min-width:52px;text-align:right;font-weight:500}
.note{border-left:2px solid var(--ink-acc);padding:6px 10px;background:var(--bg-2);font-size:12.5px;color:var(--ink-2)}
.note.warn{border-left-color:var(--warn)}.note.neg{border-left-color:var(--neg)}.note.pos{border-left-color:var(--pos)}
.list{list-style:none;margin:0;padding:0}.list li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2);align-items:flex-start;font-size:12.5px}.list li:last-child{border-bottom:0}.list .t{color:var(--ink-3);min-width:88px;font-size:12px}.list .a{margin-left:auto;display:flex;gap:4px;flex:none}
.hm td{padding:4px 6px;text-align:right;font-size:11.5px;border:1px solid var(--bg)}
.prose{max-width:72ch;line-height:1.55}.prose h3{margin:14px 0 4px}.prose .f{font-family:var(--mono);font-size:12px;background:var(--bg-2);border:1px solid var(--line-2);padding:6px 10px;border-radius:3px;margin:6px 0}
.muted{color:var(--ink-3)}.small{font-size:12px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 14px;border-radius:3px;font-size:12.5px;opacity:0;transition:.2s;pointer-events:none;z-index:70}.toast.on{opacity:1}
.bar{display:inline-block;height:5px;background:var(--bg-3);border-radius:2px;width:70px;vertical-align:middle;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink-acc)}.bar.r i{background:var(--neg)}.bar.g i{background:var(--pos)}
.phome{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:6px}
.phome .mod{border:1px solid var(--line);border-radius:3px;padding:16px;background:var(--bg)}
.phome .mod h3{font-size:14px}.phome .mod p{color:var(--ink-2);font-size:12.5px;margin:6px 0 10px;line-height:1.5}
.phome .mod a.go{font-weight:500}
.phome .mod .still{margin:-16px -16px 12px;border-radius:3px 3px 0 0;box-shadow:none;border:0;border-bottom:1px solid var(--line)}
.running{color:var(--ink-3);font-size:12px}
:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

document.getElementById('q').addEventListener('keydown', e => { if (e.key !== 'Enter') return; const v = e.target.value.trim().toLowerCase(); if (!v) return; const a = ASSETS.find(x => (x.name + ' ' + x.id).toLowerCase().includes(v)); if (a) { state.f.q = ''; location.hash = '#ws-portfolio'; setTimeout(() => { state.sel = a.id; render(); assetDrawer(a.id); }, 0); return; } const m = Object.keys(MOD_LABEL).find(k => (MOD_LABEL[k] + ' ' + MOD_PRODUCT[k].name).toLowerCase().includes(v)); if (m) location.hash = '#' + m; else toast('No match for "' + e.target.value + '"'); });
route();
</script>
<!-- ============================================================================================
     NANTEN TEASER LAYER
     Added on top of the full prototype. It does not change the prototype's own code: it watches
     which module is shown and, for locked modules, blurs the page and shows a lock card.

     TO EDIT (search for these names):
       TEASER_CONTACT  where "Request full access" leads: a mailto: address or any https link
       TEASER_OPEN     the modules visitors can use; every other module is locked

     Note: this is a visual lock. The page runs in the visitor's browser, so a technical visitor
     can remove the blur with browser tools. All figures in the prototype are synthetic.
     ============================================================================================ -->
<style>
  .tz-banner{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border:1px solid #e89b2c;border-radius:14px;padding:3px 4px 3px 10px;
    color:#f3ead6;font:500 12px/1.3 Inter,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
  .tz-banner b{color:#e89b2c;font-weight:700;letter-spacing:.02em}
  .tz-banner a{color:#14233f;background:#e89b2c;padding:3px 10px;border-radius:10px;text-decoration:none;font-weight:600}
  .tz-banner a:hover{background:#f0ad4a}
  @media (max-width:720px){.tz-banner .tz-lbl{display:none}}
  #page.tz-locked{filter:blur(7px) saturate(.75);pointer-events:none;user-select:none}
  .tz-overlay{position:fixed;z-index:55;display:flex;justify-content:center;align-items:flex-start;padding-top:9vh;
    background:linear-gradient(180deg,rgba(246,247,250,.25),rgba(246,247,250,.55))}
  [data-theme="dark"] .tz-overlay{background:linear-gradient(180deg,rgba(10,16,28,.3),rgba(10,16,28,.6))}
  .tz-card{max-width:460px;margin:0 20px;background:var(--bg,#fff);color:var(--ink,#14181f);border:1px solid var(--line,#d9dde5);border-radius:10px;
    box-shadow:0 20px 60px rgba(10,20,40,.22);padding:28px 30px;text-align:center;font:14px/1.55 Inter,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
  .tz-lock{width:52px;height:52px;margin:0 auto 14px;border-radius:50%;background:#14233f;display:grid;place-items:center}
  .tz-card h3{font:600 19px/1.3 Georgia,"Hiragino Mincho ProN",serif;margin:0 0 4px}
  .tz-card .tz-prod{font-size:12px;color:var(--ink-3,#6b7280);margin-bottom:12px}
  .tz-card p{color:var(--ink-2,#3a4150);margin:0 0 18px}
  .tz-card .tz-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .tz-card .tz-cta{background:#e89b2c;color:#14233f;font-weight:600;padding:9px 16px;border-radius:4px;text-decoration:none}
  .tz-card .tz-cta:hover{background:#f0ad4a}
  .tz-card .tz-sec{border:1px solid var(--line,#d9dde5);color:var(--ink,#14181f);padding:9px 14px;border-radius:4px;text-decoration:none;background:transparent}
  .tz-card .tz-open{margin-top:16px;font-size:12px;color:var(--ink-3,#6b7280)}
  .tz-navlock{display:inline-block;width:11px;height:11px;margin-left:6px;vertical-align:-1px;opacity:.55}
  #nav a.tz-nav-locked{opacity:.72}
  .tz-badge{position:fixed;left:16px;bottom:16px;z-index:60;background:#14233f;color:#f3ead6;font:600 12px/1 Inter,-apple-system,sans-serif;
    padding:9px 12px;border-radius:20px;box-shadow:0 6px 18px rgba(10,20,40,.25);text-decoration:none;border:1px solid #e89b2c}
  .tz-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:70;background:#14233f;color:#fff;
    padding:10px 16px;border-radius:6px;font:13px/1.4 Inter,-apple-system,"Hiragino Sans",sans-serif;transition:all .25s;pointer-events:none}
  .tz-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){.tz-toast{transition:none}}
</style>
<script>
(function () {
  var TEASER_CONTACT = "mailto:gayatri.gawande.jp@gmail.com?subject=Nanten%20-%20full%20access";
  var TEASER_OPEN = ["an-home", "an-prices", "an-spreads",            // Market Analytics
                     "fc-home",                                       // Forecasting
                     "ppa-home",                                      // PPA and Valuation
                     "brp-home", "brp-sim",                           // BRP and Route to Market
                     "fm-home", "fm-inputs", "fm-merit",              // Fuel to Market
                     "ec-home", "ec-dash", "ec-assets", "ec-bess",    // Charge Desk
                     "ts-home", "ts-hedge", "ts-uplift",              // IPP Trading Suite
                     "ts-dash", "ts-assets", "ts-bess"];              // the same Charge Desk pages, where they sit in the Trading Suite
  var TEASER_START = "an-prices";   // where "Open workspace" and "Explore open modules" lead

  var TEXT = {
    en: { banner: '<b>Demo edition</b>', cta: "Request full access",
          title: "{m} is in the full version", explore: "Explore open modules", badge: "Demo edition · request access",
          open: "Open in this demo edition: every product overview, plus {list}.",
          noexport: "Downloads and exports are available in the full version.", fallback: "This module is available to customers and pilot partners." },
    ja: { banner: '<b>デモ版</b>', cta: "フルアクセスを申し込む",
          title: "「{m}」はフル版でご利用いただけます", explore: "公開中のモジュールを見る", badge: "デモ版・アクセスを申し込む",
          open: "このデモ版で公開中：各製品の概要ページと、{list}。",
          noexport: "ダウンロードとエクスポートはフル版でご利用いただけます。", fallback: "このモジュールはお客様およびパイロットパートナー向けに提供しています。" }
  };
  var LOCK_SVG = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#e89b2c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  var NAV_LOCK = '<svg class="tz-navlock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-label="locked"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';

  function lang() { try { return state.lang === "ja" ? "ja" : "en"; } catch (e) { return "en"; } }
  function t(k) { return TEXT[lang()][k]; }
  function currentPage() {
    var h = (location.hash || "").replace("#", "");
    try { if (state.page && document.getElementById("app").classList.contains("on")) return state.page; } catch (e) {}
    return h;
  }
  function isLocked(id) { return !!id && TEASER_OPEN.indexOf(id) < 0 && typeof MOD_PRODUCT !== "undefined" && !!MOD_PRODUCT[id]; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function tr(el) { try { if (typeof translateDOM === "function") translateDOM(el); } catch (e) {} }
  // the prototype's own English-to-Japanese dictionary (JA), where it has the phrase
  function ja(s, fallback) { try { if (lang() === "ja") return (typeof JA !== "undefined" && JA[s]) || (fallback !== undefined ? fallback : s); } catch (e) {} return s; }

  // first impressions: every persona starts on an open page
  try { Object.keys(PERSONAS).forEach(function (k) { if (isLocked(PERSONAS[k].start)) PERSONAS[k].start = TEASER_START; }); } catch (e) {}   // isLocked is hoisted
  // the open modules other than overviews, named in the language shown
  function openList() {
    var order = typeof MOD_PRODUCT !== "undefined" ? Object.keys(MOD_PRODUCT) : [];
    var ids = TEASER_OPEN.filter(function (id) { return !/-home$/.test(id) && typeof MOD_LABEL !== "undefined" && MOD_LABEL[id]; })
                         .sort(function (a, b) { return order.indexOf(a) - order.indexOf(b); });   // in menu order
    var names = ids.map(function (id) { return ja(MOD_LABEL[id]); });
    if (lang() === "ja") return names.join("、");
    return names.length > 1 ? names.slice(0, -1).join(", ") + " and " + names[names.length - 1] : names.join("");
  }

  var toastEl = document.createElement("div"); toastEl.className = "tz-toast"; document.body.appendChild(toastEl);
  var toastTimer = null;
  function tzToast(msg) { toastEl.textContent = msg; toastEl.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove("on"); }, 2600); }

  var badge = document.createElement("a"); badge.className = "tz-badge"; badge.href = TEASER_CONTACT; document.body.appendChild(badge);

  // the notice sits inside the prototype's own top bar, after the logo, so the layout is unchanged
  var banner = document.createElement("span"); banner.className = "tz-banner";
  var app = document.getElementById("app"), topbar = app && app.querySelector(".top");
  if (topbar) topbar.insertBefore(banner, topbar.children[1] || null); else if (app) app.insertBefore(banner, app.firstChild);

  var overlay = document.createElement("div"); overlay.className = "tz-overlay"; overlay.style.display = "none"; document.body.appendChild(overlay);

  function placeOverlay() {
    var main = document.getElementById("main"); if (!main) return;
    var r = main.getBoundingClientRect(), top = Math.max(r.top, 0);
    overlay.style.left = r.left + "px"; overlay.style.top = top + "px"; overlay.style.width = r.width + "px"; overlay.style.height = (window.innerHeight - top) + "px";
  }

  function lockNav() {
    var nav = document.getElementById("nav"); if (!nav) return;
    nav.querySelectorAll('a[href^="#"]').forEach(function (a) {
      var id = a.getAttribute("href").slice(1);
      if (isLocked(id) && !a.querySelector(".tz-navlock")) { a.insertAdjacentHTML("beforeend", NAV_LOCK); a.classList.add("tz-nav-locked"); a.title = t("title").replace("{m}", a.textContent.trim()); }
      else if (isLocked(id)) { a.title = t("title").replace("{m}", a.textContent.trim()); }
    });
  }

  var applying = false;
  function apply() {
    if (applying) return; applying = true;
    try {
      var inApp = app && app.classList.contains("on");
      banner.innerHTML = t("banner") + ' <a href="' + esc(TEASER_CONTACT) + '">' + t("cta") + "</a>";
      badge.textContent = t("badge"); badge.style.display = inApp ? "none" : "block";
      lockNav();
      var id = currentPage(), page = document.getElementById("page");
      if (inApp && page && isLocked(id)) {
        page.classList.add("tz-locked"); page.setAttribute("aria-hidden", "true");
        var prod = MOD_PRODUCT[id], label = ja((typeof MOD_LABEL !== "undefined" && MOD_LABEL[id]) || id);
        var descEn = (typeof MOD_DESC !== "undefined" && MOD_DESC[id]) || TEXT.en.fallback;
        var desc = ja(descEn, TEXT.ja.fallback);
        overlay.innerHTML = '<div class="tz-card" role="dialog" aria-label="' + esc(label) + ' locked"><div class="tz-lock">' + LOCK_SVG + "</div>" +
          "<h3>" + esc(t("title").replace("{m}", label)) + '</h3><div class="tz-prod">' + esc(prod ? ja(prod.name) : "") + "</div>" +
          "<p>" + esc(desc) + '</p><div class="tz-actions"><a class="tz-cta" href="' + esc(TEASER_CONTACT) + '">' + t("cta") + "</a>" +
          '<a class="tz-sec" href="#' + TEASER_START + '">' + t("explore") + '</a></div><div class="tz-open">' + esc(t("open").replace("{list}", openList())) + "</div></div>";
        tr(overlay); placeOverlay(); overlay.style.display = "flex";
      } else {
        if (page) { page.classList.remove("tz-locked"); page.removeAttribute("aria-hidden"); }
        overlay.style.display = "none";
      }
      if (document.title.indexOf("Demo edition") !== 0) document.title = "Demo edition · " + document.title;
    } finally { applying = false; }
  }

  // downloads and exports are part of the full version
  try { if (typeof saveFile === "function") window.saveFile = function () { tzToast(t("noexport")); }; } catch (e) {}
  var EXPORT_RE = /(download|export|\bcsv\b|\bpdf\b|api call|ダウンロード|エクスポート)/i;
  document.addEventListener("click", function (e) {
    var el = e.target.closest && e.target.closest("[data-dl], button, a");
    if (!el || el.closest(".tz-card, .tz-banner, .tz-badge")) return;
    if (el.hasAttribute("data-dl") || EXPORT_RE.test(el.textContent || "")) { e.preventDefault(); e.stopImmediatePropagation(); tzToast(t("noexport")); }
  }, true);

  var obs = new MutationObserver(function () { if (!applying) requestAnimationFrame(apply); });
  ["page", "nav", "app", "land"].forEach(function (id) {
    var el = document.getElementById(id); if (!el) return;
    var opts = { childList: true };
    if (id === "app" || id === "land") { opts.attributes = true; opts.attributeFilter = ["class"]; }
    obs.observe(el, opts);
  });
  // entering the workspace from the landing page goes to an open page, not to a locked Today
  window.addEventListener("hashchange", function (e) {
    var from = (e.oldURL.split("#")[1] || "home"), to = (location.hash || "").replace("#", "");
    if (["home", "products", "clients", "platform"].indexOf(from) >= 0 && to === "ws-home" && isLocked("ws-home")) { location.replace("#" + TEASER_START); return; }
    requestAnimationFrame(apply);
  });
  window.addEventListener("resize", placeOverlay);
  apply();
})();
</script>
